<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>I LOVE YOU ISABELITA</title>

<style>
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

/* Fondo corazones optimizado */
.bg_heart{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

.heart{
  position:absolute;
  top:-50%;
  transform:rotate(-45deg);
}

.heart:before,
.heart:after{
  position:absolute;
  content:"";
  width:100%;
  height:100%;
  background:inherit;
  border-radius:100%;
}

.heart:before{ top:-50%; left:0; }
.heart:after{ top:0; right:-50%; }

@keyframes love{
  0%{ top:110%; }
  100%{ top:-10%; }
}

/* Texto central */
#loveText{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  font-size:clamp(36px, 8vw, 96px);
  font-weight:bold;
  pointer-events:none;
  z-index:5;
  text-align:center;
}

#loveText span{
  opacity:0;
  display:inline-block;
  transform:translateY(200px);
}

@keyframes letterUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="bg_heart"></div>
<div id="loveText"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
/* Corazones optimizados (menos lag) */
setInterval(function () {
  var r_num  = Math.floor(Math.random()*40)+1;
  var r_size = Math.floor(Math.random()*50)+15; // tamaño más moderado
  var r_left = Math.floor(Math.random()*100)+1;
  var r_bg   = Math.floor(Math.random()*25)+100;
  var r_time = Math.floor(Math.random()*5)+5;

  $(".bg_heart").append(
    "<div class='heart' style='width:"+r_size+
    "px;height:"+r_size+
    "px;left:"+r_left+
    "%;background:rgba(255,"+(r_bg-25)+","+r_bg+
    ",1);animation:love "+r_time+"s linear'></div>"
  );

  $(".heart").each(function(){
    if (parseFloat($(this).css("top")) <= -100) $(this).remove();
  });

}, 400); // frecuencia +20%

/* Letras suben lentamente, más grandes y suaves */
const text = "I LOVE YOU ISABELITA";
const container = $("#loveText");

text.split("").forEach((ch, i) => {
  const r_bg = Math.floor(Math.random()*25)+100;
  const color = `rgba(255,${r_bg-25},${r_bg},1)`;

  const span = $("<span>").text(ch === " " ? "\u00A0" : ch);
  span.css({
    color: color,
    animation: "letterUp 2s ease forwards",
    "animation-delay": (i * 0.35) + "s" // más lento, una letra a la vez
  });

  container.append(span);
});
</script>

</body>
</html>
