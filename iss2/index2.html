<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi niña</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier Prime', monospace;
    background-color: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

#cuadro {
    position: relative;
    width: 400px;
    height: 300px;
    background: url('assets/romantic.jpg') center/cover no-repeat;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
    font-size: 1.8em;
    font-weight: bold;
}

/* Capa blanca semi-transparente */
#cuadro::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: rgba(255, 255, 255, 0.6);
    z-index: 1;
}

/* Texto central */
#texto {
    position: relative;
    z-index: 2;
}

/* Corazones flotantes */
.heart {
    position: absolute;
    bottom: 0;
    font-size: 24px;
    color: #ff3b5c;
    opacity: 0.8;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
    }
    100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>
<body>

<div id="cuadro">
    <div id="texto">...para mi niña...<br>Esto solo se abrirá el 14 de febrero, Isabelita ❤️</div>
</div>

<script>
// Crear corazones cada cierto tiempo
function crearCorazon() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = 4 + Math.random() * 3 + 's';
    heart.textContent = '❤️';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000); // eliminar tras animación
}

// Generar corazones continuamente
setInterval(crearCorazon, 300);

// Mostrar solo el 14 de febrero
const hoy = new Date();
if (!(hoy.getMonth() === 1 && hoy.getDate() === 14)) {
    document.getElementById('cuadro').style.display = 'none';
    alert('Este mensaje solo estará disponible el 14 de febrero.');
}
</script>

</body>
</html>
